name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. Breaking changes, new public APIs, large native rewrites, and default-behavior changes should be agreed here before implementation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched open and closed issues for an existing request.
          required: true
        - label: This request is specific to webview_flutter_windows or its WebView2 integration.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What cannot be done cleanly today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior or API
      description: Describe the desired observable behavior. Include a typed Dart API sketch if useful.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and defaults
      description: Explain effects on existing apps, default behavior, WebView2 support, and migration needs.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or WebView2 APIs you evaluated.

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to contribute an implementation?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
