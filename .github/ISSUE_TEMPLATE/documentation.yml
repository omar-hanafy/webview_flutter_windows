name: Documentation improvement
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight check
      options:
        - label: I checked the README, migration guide, example, and published API documentation where relevant.
          required: true

  - type: input
    id: location
    attributes:
      label: Affected documentation
      description: Link the page, section, API, file, or example.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is missing, unclear, or incorrect?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Proposed wording, example, or structure is welcome.
