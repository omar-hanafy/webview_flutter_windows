name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on ${{ matrix.sdk.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - {name: stable, version: ''}
          - {name: Flutter 3.44.0, version: '3.44.0'}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.sdk.version }}
          cache: true

      - name: Validate release lane
        env:
          TARGET_LANE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$TARGET_LANE" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$TARGET_LANE" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $version."
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test example at the minimum Flutter version
        if: matrix.sdk.version == '3.44.0'
        working-directory: example
        run: flutter test

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.14

      - name: Run pana (full score required)
        run: pana --exit-code-threshold 0 .

  example:
    name: Example analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: dart pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze example
        run: flutter analyze
        working-directory: example

      - name: Test example
        run: flutter test
        working-directory: example

  agent_plugin:
    name: Agent plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Validate agent plugin tree
        run: dart tool/validate_agent_plugin.dart

  native_tests:
    name: Native unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S windows/test -B build/native_tests
      - name: Build
        run: cmake --build build/native_tests --config Release
      - name: Run
        run: ctest --test-dir build/native_tests -C Release --output-on-failure

  windows_example:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Standalone WebView2 on the latest Windows runner
            runner: windows-latest
            peer: false
          # The peer's legacy coroutine headers require Visual Studio 2022.
          - name: WebView2 alongside flutter_inappwebview_windows
            runner: windows-2022
            peer: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Seed the build cache used by flutter_inappwebview_windows 0.6.0
        if: matrix.peer
        shell: pwsh
        working-directory: example
        run: |
          $packages = @{
            'Microsoft.Web.WebView2' = '1.0.2792.45'
            'Microsoft.Windows.ImplementationLibrary' = '1.0.231216.1'
            'nlohmann.json' = '3.11.2'
          }
          foreach ($id in $packages.Keys) {
            nuget install $id -Version $packages[$id] -ExcludeVersion -OutputDirectory build/windows/x64/packages -NonInteractive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Register a second plugin that creates a dispatcher queue
        if: matrix.peer
        working-directory: example
        run: flutter pub add flutter_inappwebview_windows@0.6.0
      - run: flutter build windows --release
        working-directory: example
      - name: Verify the plugin imports its own versioned NuGet targets
        shell: pwsh
        working-directory: example
        run: |
          $plugin = 'build/windows/x64/plugins/webview_flutter_windows'
          [xml]$project = Get-Content "$plugin/webview_flutter_windows_plugin.vcxproj" -Raw
          $imports = $project.SelectNodes("//*[local-name()='Import']") | ForEach-Object { $_.Project.Replace('\', '/') }
          foreach ($id in 'Microsoft.Web.WebView2', 'Microsoft.Windows.ImplementationLibrary') {
            $package = Get-Item "$plugin/packages/$id.*/build/native/$id.targets"
            $relative = [IO.Path]::GetRelativePath((Resolve-Path $plugin).Path, $package.FullName).Replace('\', '/')
            if (!($imports | Where-Object { $_.EndsWith($relative, [StringComparison]::OrdinalIgnoreCase) })) {
              throw "The Windows plugin does not import $relative"
            }
          }
      - name: Verify bundle contents
        shell: pwsh
        working-directory: example
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Get-ChildItem $bundle
          if (!(Test-Path "$bundle/webview_flutter_windows_example.exe")) { throw "missing example exe" }
          if (!(Test-Path "$bundle/webview_flutter_windows_plugin.dll")) { throw "missing plugin dll" }
          if (!(Test-Path "$bundle/WebView2Loader.dll")) { throw "missing WebView2Loader.dll" }
      - name: Verify the companion plugin registered
        if: matrix.peer
        working-directory: example
        shell: pwsh
        run: |
          if (!(Select-String -Quiet -Path windows/flutter/generated_plugin_registrant.cc -Pattern 'FlutterInappwebviewWindowsPluginCApiRegisterWithRegistrar')) {
            throw 'The companion webview plugin was not registered.'
          }
      - name: Run the WebView2 lifecycle
        working-directory: example
        run: flutter test integration_test/controller_lifecycle_test.dart -d windows --reporter expanded

  build_windows:
    name: Build Windows example
    needs: windows_example
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both Windows builds and runtime tests
        env:
          WINDOWS_RESULT: ${{ needs.windows_example.result }}
        run: test "$WINDOWS_RESULT" = success
