name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release lane
        env:
          TARGET_LANE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$TARGET_LANE" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$TARGET_LANE" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $version."
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.14

      - name: Run pana (full score required)
        run: pana --exit-code-threshold 0 .

  example:
    name: Example analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: dart pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze example
        run: flutter analyze
        working-directory: example

      - name: Test example
        run: flutter test
        working-directory: example

  agent_plugin:
    name: Agent plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate agent plugin tree
        run: dart tool/validate_agent_plugin.dart

  native_tests:
    name: Native unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S windows/test -B build/native_tests
      - name: Build
        run: cmake --build build/native_tests --config Release
      - name: Run
        run: ctest --test-dir build/native_tests -C Release --output-on-failure

  build_windows:
    name: Build Windows example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build windows --release
        working-directory: example
      - name: Verify bundle contents
        shell: pwsh
        working-directory: example
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Get-ChildItem $bundle
          if (!(Test-Path "$bundle/webview_flutter_windows_example.exe")) { throw "missing example exe" }
          if (!(Test-Path "$bundle/webview_flutter_windows_plugin.dll")) { throw "missing plugin dll" }
          if (!(Test-Path "$bundle/WebView2Loader.dll")) { throw "missing WebView2Loader.dll" }
