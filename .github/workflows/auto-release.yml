name: Auto release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.repository }}-webview_flutter_windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TAG_PUSH_PAT }}

      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          pubspec='pubspec.yaml'
          before="$BEFORE_SHA"

          if [[ "$before" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version=$(awk '/^version:/ {print $2; exit}' "$pubspec" | tr -d "\"'")
          if [[ -z "$new_version" ]]; then
            echo "Unable to read version from $pubspec."
            exit 1
          fi

          if git cat-file -e "$before:$pubspec" 2>/dev/null; then
            old_version=$(git show "$before:$pubspec" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          else
            old_version=''
          fi

          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version remains $new_version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'

          if [[ "${GITHUB_REF_NAME}" == 'main' && ! "$new_version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $new_version."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == 'dev' && ! "$new_version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $new_version."
            exit 1
          fi

          {
            echo 'changed=true'
            echo "value=$new_version"
            echo "tag=webview_flutter_windows-v$new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag state
        id: tag_state
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            target=$(git rev-list -n 1 "refs/tags/$tag")
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to $target, not $GITHUB_SHA. Never move or reuse a release tag."
              exit 1
            fi
            echo "Tag $tag already points to this release commit; continuing the retry."
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true' && steps.tag_state.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; nothing to repair."
            exit 0
          fi
          args=("$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --target "$GITHUB_SHA")
          if [[ "${GITHUB_REF_NAME}" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
